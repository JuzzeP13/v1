<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — TISH SEARCH</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Unbounded:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/admin/css/admin_login.css">
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>🛡️ Admin Panel</h1>
    <p>TISH SEARCH — Управление системой</p>
  </div>
  <div class="panel">
    <h2>Вход администратора</h2>
    <p class="subtitle">Доступ только для авторизованных администраторов</p>
    
    {% if error %}
    <div class="flash">❌ {{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/admin/login" id="loginForm">
      <div class="form-group">
        <label for="username">Логин администратора</label>
        <input type="text" id="username" name="username" placeholder="TISH_TEAM_SEARCH" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль администратора</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">🔐 Войти в админ-панель</button>
    </form>
    
    <div class="back-link">
      <a href="/">← Вернуться на главную</a>
    </div>
  </div>
</div>

<script src="/static/admin/js/admin_login.js"></script>
</body>
</html>
